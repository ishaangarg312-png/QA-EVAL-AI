name: AI Agent QA & Regression Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly regression suite at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'qa'
      quality_gate_score:
        description: 'Minimum Quality Gate Score Threshold'
        required: true
        default: '85.0'

jobs:
  agent-qa-test:
    name: Execute AI Agent QA Suites & Release Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Unit & Integration Tests
        run: |
          pytest -v

      - name: Execute Travel AI Agent Regression Suite via CLI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          python backend/cli.py run --project travel-ai --suite regression --env qa --quality-gate 85.0

      - name: Evaluate Release Gate Decision
        if: always()
        run: |
          echo "================================================="
          echo "AI Agent QA Test Execution & Evaluation Completed"
          echo "================================================="
